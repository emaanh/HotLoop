[project]
name = "hotloop-agents"
version = "0.0.1"
description = "Agent adapters; a model is an OpenAI-compatible URL"
requires-python = ">=3.11,<3.13"
dependencies = ["hotloop-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotloop_agents"]
