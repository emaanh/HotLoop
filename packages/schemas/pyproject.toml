[project]
name = "hotloop-schemas"
version = "0.0.1"
description = "On-disk contracts shared by all HotLoop components (task package, result, trajectory)"
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotloop_schemas"]
