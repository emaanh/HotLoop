[project]
name = "hotloop-runner"
version = "0.0.1"
description = "Sandbox lifecycle, budgets, trajectory capture on remote GPU hosts"
requires-python = ">=3.11,<3.13"
dependencies = ["hotloop-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotloop_runner"]
