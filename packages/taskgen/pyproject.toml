[project]
name = "hotloop-taskgen"
version = "0.0.1"
description = "Procedural task generator and certification; emits immutable task packages"
requires-python = ">=3.11,<3.13"
dependencies = ["hotloop-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotloop_taskgen"]
